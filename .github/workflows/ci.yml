name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-local
  CARGO_TERM_COLOR: always
jobs:
  core:
    name: Core (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The supported platforms: Ubuntu 24.04 and 26.04 on x86_64, and macOS
        # on Apple silicon (macos-latest is arm64).
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: .cargo-local/registry
          key: core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Repository tooling regressions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Core checks (no TeX required)
        run: scripts/check.sh
  desktop:
    name: Desktop and TeX (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One package each for Linux x86_64 and macOS Apple silicon. Linux
        # builds on the oldest supported Ubuntu so its glibc baseline (2.39)
        # also runs on 26.04; deb-install checks both.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libegl1-mesa-dev latexmk texlive-latex-base texlive-latex-recommended cm-super texlive-xetex texlive-extra-utils texlive-bibtex-extra biber
      - name: macOS TeX
        if: runner.os == 'macOS'
        run: |
          brew install --cask basictex
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          # BasicTeX's bundled tlmgr refuses to install anything until it has
          # caught up with the package repository.
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install latexmk fontspec latexpand biblatex biber cm-super
      - uses: actions/cache@v4
        with:
          path: .cargo-local/registry
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'desktop/Cargo.lock') }}
      - name: Fetch locked dependencies and PDFium
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path desktop/Cargo.toml
          scripts/setup-pdfium.sh
      - name: Format, lint, unit and real TeX/PDF tests
        run: scripts/check.sh --desktop --tex
      - name: Package native application
        run: |
          # Tagged releases use the manifest version as is; every other build
          # is a rolling build that sorts after it and names its commit.
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' desktop/Cargo.toml)"
            stamp="$(git log -1 --format=%cd --date=format:%Y%m%d%H%M%S)"
            export FOLIO_PACKAGE_VERSION="$version+git.$stamp.${GITHUB_SHA::7}"
          fi
          scripts/package.sh
      - name: Inspect the disk image
        if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/folio-dmg" dist/folio-*.dmg
          codesign --verify --deep --strict "$RUNNER_TEMP/folio-dmg/Folio.app"
          test -L "$RUNNER_TEMP/folio-dmg/Applications"
          hdiutil detach "$RUNNER_TEMP/folio-dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/folio-*.zip
            dist/folio-*.tar.gz
            dist/folio-*.dmg
            dist/folio_*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  deb-install:
    name: Install .deb (${{ matrix.os }})
    needs: desktop
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: folio-Linux-X64
          path: dist
      - name: Install and inspect the Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/folio_*.deb
          test "$(readlink -f /usr/bin/folio)" = /usr/lib/folio/folio
          if ldd /usr/lib/folio/folio | grep 'not found'; then exit 1; fi
          dpkg -L folio
  release:
    # master publishes the "rolling" prerelease; a v<version> tag publishes a
    # proper release. Both only after every check and package job passed.
    name: Publish release
    needs: [core, desktop, deb-install]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect release assets
        run: |
          mkdir release
          cp artifacts/folio-*.dmg artifacts/folio_*.deb release/
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
          cat > notes.md <<'NOTES'
          **macOS** (Apple silicon, 12+): open the `.dmg` and drag Folio to Applications.
          The app is ad-hoc signed, not notarized. If macOS says it is damaged or cannot
          be checked, run `xattr -dr com.apple.quarantine /Applications/Folio.app` once.

          **Ubuntu 24.04 or 26.04** (x86_64): `sudo apt install ./folio_<version>_amd64.deb`,
          then start `folio` from the terminal or the application menu.

          TeX is not bundled: install a distribution with `latexmk` and `synctex`.
          NOTES
      - name: Publish proper release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' desktop/Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/Cargo.toml version $version." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag \
            --title "Folio $version" --notes-file notes.md --generate-notes
      - name: Publish rolling release
        if: github.ref == 'refs/heads/master'
        run: |
          # Recreate it so the tag follows master and only the newest assets remain.
          gh release delete rolling --cleanup-tag --yes || true
          {
            echo "Latest successful build of \`master\` at ${GITHUB_SHA::7}. Not a stable release."
            echo
            cat notes.md
          } > rolling.md
          gh release create rolling release/* --target "$GITHUB_SHA" --prerelease \
            --title "Folio rolling (${GITHUB_SHA::7})" --notes-file rolling.md
