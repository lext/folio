[package]
name = "folio-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Offline document, LaTeX build, PDF index and SyncTeX core for Folio"

[lib]
name = "folio_core"

[dependencies]
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }

[profile.release]
lto = "thin"
strip = true
