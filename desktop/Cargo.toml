[package]
name = "folio"
version = "0.9.5"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "A local GPU-accelerated LaTeX editor"

[dependencies]
folio-core = { path = ".." }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
tree-sitter = "0.25"
tree-sitter-latex = "=0.1.0"
rfd = "0.15"
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }

# eframe's defaults are off; wgpu needs explicit native GPU backends.
wgpu = { version = "=27.0.1", default-features = false, features = ["metal", "vulkan", "gles"] }

# Already in the tree through Metal; used to free Cmd+H from the app menu.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[build-dependencies]
cc = "1"

[patch.crates-io]
# Metal/wgpu still use block 0.1.6; keep its foreign class declaration valid
# on new Rust compilers. See vendor/block/PATCH.md.
block = { path = "../vendor/block" }

[profile.release]
lto = "thin"
strip = true
